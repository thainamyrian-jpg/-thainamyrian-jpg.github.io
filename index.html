<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz Dia dos Pais</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:#f5f1eb; color:#2b2927;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  .card{
    width:min(520px,100%); background:#fffdf9; border-radius:24px;
    padding:28px 22px 30px; text-align:center;
    box-shadow:0 10px 35px rgba(0,0,0,.10);
  }
  img{width:100%; max-height:420px; object-fit:contain; border-radius:16px}
  h1{font-size:28px; margin:20px 0 8px}
  p{font-size:17px; line-height:1.5; margin:8px 0 18px}
  .quote{font-style:italic}
  audio{width:100%; margin-top:8px}
  .small{font-size:13px; opacity:.65; margin-top:18px}
</style>
</head>
<body>
<main class="card">
  <img src="familia.png" alt="Ilustração da família abraçando o pai">
  <h1>Feliz Dia dos Pais ❤️</h1>
  <p class="quote">“Pai, seu abraço é o nosso lar.”</p>
  <p>Preparamos uma mensagem especialmente para você.</p>
  <audio controls preload="metadata">
    <source src="mensagem.mp3" type="audio/mpeg">
    Seu navegador não conseguiu reproduzir o áudio.
  </audio>
  <div class="small">Com amor, seus filhos.</div>
</main>
</body>
</html>
